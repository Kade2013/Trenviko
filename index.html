

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRENVIKO | AI-Powered Shopping & Trending Products</title>
 <meta name="description" content="Discover trending tech, sports gear, and everyday essentials at TRENVIKO. Explore products with help from our AI shopping assistant.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#0b131a;
 --panel:#17252f;
 --panel2:#20333e;
 --green:#6ee7b7;
 --muted:#cbd5e1;
 --line:#304457;
 --red:#ff9b9b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);color:white;
 font-family:"DM Sans",Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
 outline:2px solid var(--green);outline-offset:3px;
}
button:disabled{opacity:.5;cursor:not-allowed}
header{
 position:sticky;top:0;z-index:20;
 background:#0b131af5;border-bottom:1px solid var(--line);
 padding:15px 5%;display:flex;
 align-items:center;justify-content:space-between;
 gap:14px;flex-wrap:wrap;
}
.logo{
 border:0;background:none;color:var(--green);
 font-size:25px;font-weight:800;letter-spacing:2px;
}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav button,.menu-toggle{
 background:#243542;color:white;border:0;
 padding:10px;border-radius:8px;
}
nav button:hover{color:var(--green)}
.menu-toggle{display:none}
main{min-height:65vh}
.hero{
 margin:22px 5%;padding:85px 7%;
 background:linear-gradient(120deg,#14242c,#1e4140);
 border:1px solid #38554e;border-radius:20px;
}
.hero h1{
 font-size:clamp(38px,6vw,72px);
 letter-spacing:-2px;line-height:1.08;
 margin:18px 0;
}
.hero p{max-width:540px}
.eyebrow,.category{
 color:var(--green);font-size:12px;
 letter-spacing:1.5px;font-weight:800;
 text-transform:uppercase;
}
.description,p.muted{color:var(--muted);line-height:1.65}
.btn{
 background:var(--green);color:var(--bg);
 border:0;border-radius:9px;
 padding:12px 19px;font-weight:800;
}
.btn:hover{filter:brightness(1.08)}
.secondary{background:var(--line);color:white}
.danger{background:#71343e;color:white}
.section{padding:42px 5% 65px}
.section-title{
 display:flex;justify-content:space-between;
 align-items:center;gap:12px;flex-wrap:wrap;
 margin-bottom:22px;
}
.section-title h2{margin:6px 0;font-size:30px}
.banner{
 margin:0 5%;padding:28px;text-align:center;
 background:#152c2c;border:1px solid #34574b;
 border-radius:14px;
}
.banner h2{color:var(--green)}
.shop-toolbar{
 display:flex;gap:12px;flex-wrap:wrap;
 margin:22px 0;
}
.field,.search-box,.sort-select{
 background:var(--panel);color:white;
 border:1px solid #405162;
 border-radius:9px;padding:12px;
 min-width:0;
}
.search-box{flex:1;min-width:180px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
 background:var(--panel);color:white;
 border:1px solid #405162;
 border-radius:25px;padding:9px 14px;
}
.filter-btn.active{
 background:var(--green);color:var(--bg);
}
.grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:20px;
}
.card{
 background:var(--panel);
 border:1px solid #2c4048;
 border-radius:14px;padding:15px;
 display:flex;flex-direction:column;
}
.card:hover{border-color:var(--green)}
.image-wrap{position:relative}
.product-image{
 width:100%;aspect-ratio:4/3;
 object-fit:cover;border-radius:10px;
 background:#253942;
}
.image-placeholder{
 display:grid;place-items:center;
 color:var(--muted);
}
.badge-stack{
 position:absolute;top:10px;left:10px;
 display:flex;flex-direction:column;gap:6px;
 align-items:flex-start;
}
.product-badge{
 background:var(--green);color:#081711;
 padding:6px 10px;border-radius:5px;
 font-size:11px;font-weight:800;
}
.product-badge.trending{
 background:#f9c86d;color:#211a08;
}
.product-badge.bestseller{
 background:#d6c5ff;color:#211337;
}
.heart-btn{
 position:absolute;right:10px;top:10px;
 width:42px;height:42px;border-radius:50%;
 border:1px solid #60727c;
 background:#0b131a;color:white;font-size:25px;
}
.heart-btn.active{color:#ff8fa3}
.card h3{margin:14px 0 6px}
.card .description{font-size:14px;flex:1}
.price{
 color:var(--green);font-size:25px;
 font-weight:800;margin:10px 0;
}
.price-row{
 display:flex;gap:10px;align-items:center;
 flex-wrap:wrap;margin:10px 0;
}
.price-row .price{margin:0}
.old-price{
 text-decoration:line-through;
 color:#a7b3bd;font-size:15px;
}
.discount{
 color:#ffd4a1;background:#583b22;
 border-radius:5px;padding:5px 8px;
 font-size:12px;font-weight:800;
}
.card .btn{width:100%;margin-top:auto}
.collection-links{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:16px;margin-top:24px;
}
.collection-tile{
 background:linear-gradient(145deg,#203c40,#15232e);
 border:1px solid #38554e;border-radius:13px;
 padding:30px;text-align:left;color:white;
}
.collection-tile h3{font-size:23px}
.collection-tile:hover{border-color:var(--green)}
.brand-values{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:20px;padding:15px 5% 60px;
}
.value-card{
 background:#14232d;border:1px solid #2c4048;
 padding:23px;border-radius:12px;text-align:center;
}
.value-card h3{color:var(--green)}
.value-card p{color:var(--muted)}
.detail-layout{
 display:grid;grid-template-columns:1fr 1fr;
 gap:36px;margin-top:25px;
}
.detail-image{
 width:100%;aspect-ratio:4/3;
 object-fit:cover;border-radius:14px;
 background:#253942;
}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{
 width:85px;height:70px;object-fit:cover;
 border:2px solid transparent;
 border-radius:8px;cursor:pointer;
}
.thumb.active{border-color:var(--green)}
.detail-info p{color:var(--muted);line-height:1.7}
.quantity{margin:20px 0}
.quantity input{
 width:78px;background:var(--panel);
 color:white;border:1px solid #64748b;
 padding:10px;border-radius:6px;
}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.benefits{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:25px 0;
}
.benefit{
 background:#14232d;border:1px solid #2c4048;
 border-radius:9px;padding:14px;text-align:center;
}
.benefit strong{color:var(--green)}
.benefit p{font-size:12px}
details{
 background:var(--panel);
 border:1px solid var(--line);
 padding:17px;border-radius:9px;margin:10px 0;
}
summary{cursor:pointer;font-weight:700}
.notice{
 background:var(--panel);color:var(--muted);
 padding:18px;border-radius:10px;margin:20px 0;
 line-height:1.6;
}
.panel,.info-panel{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:14px;padding:24px;margin:18px 0;
}
.info-panel{max-width:850px}
.panel p,.info-panel p{
 color:var(--muted);line-height:1.7;
}
.two-col{
 display:grid;grid-template-columns:1fr 1fr;gap:22px;
}
.form-grid{
 display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.form-grid label,.contact-form label{
 display:grid;gap:7px;color:var(--muted);
 font-size:13px;
}
.form-grid .wide{grid-column:1/-1}
.form-grid .field{width:100%}
.contact-form{
 display:grid;gap:14px;max-width:560px;
}
textarea{resize:vertical}
.profit-results{
 display:grid;grid-template-columns:1fr 1fr;
 gap:12px;margin-top:20px;
}
.result-box,.stat{
 background:#10272a;border:1px solid #315b50;
 border-radius:10px;padding:18px;
}
.result-box span,.stat span{
 display:block;color:var(--muted);font-size:13px;
}
.result-box strong,.stat strong{
 display:block;color:var(--green);
 font-size:26px;margin-top:7px;
}
.result-box strong.negative{color:var(--red)}
.stat-row{
 display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.saved-item{
 background:#14232d;border:1px solid var(--line);
 border-radius:12px;padding:20px;margin:14px 0;
 overflow-wrap:anywhere;
}
.saved-item a{color:var(--green)}
.small-note{color:var(--muted);font-size:12px}
.tag{
 display:inline-block;background:#25433d;
 color:var(--green);border-radius:20px;
 padding:5px 10px;font-size:12px;
}
.empty-state{
 background:var(--panel);padding:25px;
 border-radius:12px;color:var(--muted);
}
.cart-item{
 display:flex;justify-content:space-between;
 align-items:center;gap:20px;
 border-bottom:1px solid #405162;padding:20px 0;
}
.cart-controls{
 display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.small-btn{
 background:var(--line);color:white;
 border:0;border-radius:6px;padding:9px 13px;
}
.subtotal{text-align:right;font-size:25px;margin:25px 0}
.demo-review{
 background:#14232d;border:1px solid var(--line);
 border-radius:12px;padding:20px;
}
.demo-review .stars{color:#f9c86d;letter-spacing:2px}
.demo-label{
 color:#ffd4a1;font-size:12px;font-weight:800;
 text-transform:uppercase;
}
.toast{
 display:none;position:fixed;bottom:24px;right:24px;
 background:var(--green);color:var(--bg);
 padding:15px 20px;border-radius:9px;
 font-weight:800;z-index:30;
}
footer{
 text-align:center;padding:40px;
 color:#94a3b8;background:#090f14;
}
footer button{
 background:none;border:0;color:var(--green);
 text-decoration:underline;margin:5px;
}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .detail-layout,.two-col{grid-template-columns:1fr}
}
@media(max-width:650px){
 header{padding:14px 5%}
 .menu-toggle{display:block}
 nav{display:none;flex-direction:column;width:100%}
 nav.open{display:flex}
 nav button{width:100%;text-align:left}
 .hero{margin:15px 4%;padding:55px 7%}
 .section{padding:30px 4%}
 .banner{margin:0 4%}
 .brand-values,.benefits,.collection-links{
  grid-template-columns:1fr;
 }
 .search-box,.sort-select{width:100%}
 .cart-item{flex-direction:column;align-items:flex-start}
}
@media(max-width:440px){
 .grid,.form-grid,.profit-results,.stat-row{
  grid-template-columns:1fr;
 }
 .form-grid .wide{grid-column:auto}
}

/* Day 16 additions */
.announcement{background:#6ee7b7;color:#0b131a;text-align:center;padding:10px 5%;font-weight:800;font-size:13px}
.flash-box{margin:18px 5%;padding:24px;border:1px solid #497968;border-radius:14px;background:#15332e;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.flash-box h2{margin:5px 0}
.flash-clock{font-size:27px;font-weight:800;color:#6ee7b7;font-variant-numeric:tabular-nums}
.cart-summary{max-width:440px;margin:25px 0 25px auto;padding:22px;background:#17252f;border:1px solid #304457;border-radius:14px}
.cart-summary-line{display:flex;justify-content:space-between;gap:15px;margin:12px 0}
.cart-summary-line.total{font-size:23px;font-weight:800;color:#6ee7b7;border-top:1px solid #304457;padding-top:15px}


/* DAY 17 */
.stock-pill{display:inline-block;color:#bcead4;background:#21443b;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;margin:4px 0 10px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.card-actions .btn{padding:11px 7px;font-size:13px}
.overlay{position:fixed;inset:0;background:#0009;z-index:45;display:none}
.overlay.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:#13232d;z-index:46;transform:translateX(105%);transition:transform .2s ease;padding:24px;overflow:auto;box-shadow:-8px 0 35px #0007}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drawer-item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.drawer-item img{width:62px;height:62px;object-fit:cover;border-radius:7px}
.drawer-item .small-btn{padding:5px 9px}
.progress-track{height:12px;border-radius:20px;background:#344854;overflow:hidden;margin:10px 0}
.progress-fill{height:100%;background:var(--green);width:0%;transition:width .2s}
.quick-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:48;background:#17252f;border:1px solid #507468;border-radius:16px;padding:24px;width:min(760px,94vw);max-height:90vh;overflow:auto;display:none}
.quick-modal.open{display:block}
.quick-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.quick-layout img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
@media(max-width:650px){.quick-layout{grid-template-columns:1fr}.card-actions{grid-template-columns:1fr}.drawer{padding:17px}.quick-modal{padding:15px}header{gap:8px}.hero h1{font-size:clamp(32px,8vw,54px)}}

/* DAY 18 */
.demo-rating{color:#f9c86d;font-size:13px;margin:7px 0}.variant-picker{margin:15px 0;display:grid;gap:7px}.variant-picker select{max-width:260px}.promo-form{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.promo-form input{flex:1;min-width:130px}.suggestions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.suggestions button{border:1px solid #4a6b65;background:#203b39;color:#e3fff1;border-radius:20px;padding:7px 12px}.analytics-list{display:grid;gap:9px}.analytics-line{display:flex;justify-content:space-between;gap:15px;padding:10px;border-bottom:1px solid var(--line)}

 })[c]);
}

function discountPercent(product){
 if(!hasSale(product))return 0;
 return Math.round(
  (product.originalPrice-product.price)/
  product.originalPrice*100
 );
}

function priceHTML(product){
 return `
  <div class="price-row">
   <span class="price">${money(product.price)}</span>
   ${hasSale(product)?`
    <span class="old-price">${money(product.originalPrice)}</span>
    <span class="discount">
     SAVE ${discountPercent(product)}%
    </span>
   `:""}
  </div>
 `;
}

  const matchCategory=
   activeCategory==="All"||p.category===activeCategory;
  const text=(p.name+" "+p.category+" "+p.description)
   .toLowerCase();
  return matchCategory&&text.includes(searchTerm);
 });

 if(sortMode==="price-low")
  filtered.sort((a,b)=>a.price-b.price);

  filtered.sort((a,b)=>b.price-a.price);

  filtered.sort((a,b)=>a.name.localeCompare(b.name));

  filtered.length+" product(s) found";

  filtered.length

function gallery(product){
 const extras=Array.isArray(product.images)
  ?product.images.map(safeURL).filter(Boolean)
  :[];

 const main=safeURL(product.image);

 if(extras.length){
  return [...new Set([main,...extras].filter(Boolean))];
 }

 if(!main)return [];

 return [
  main,
  main.replace("w=800","w=1000")
   .replace("fit=crop","fit=crop&crop=left"),
  main.replace("w=800","w=1000")
   .replace("fit=crop","fit=crop&crop=right")
 ];
}

function selectGallery(index){
 const product=findProduct(currentProductId);
 if(!product)return;

 const photo=gallery(product)[index];
 if(!photo)return;

 document.getElementById("detail-main-image").src=photo;

 document.querySelectorAll(".thumb").forEach((thumb,i)=>{
  thumb.classList.toggle("active",i===index);
  thumb.setAttribute("aria-pressed",String(i===index));
 });
}

function shippingProgress(subtotal){
 const target=75,remaining=Math.max(0,target-subtotal);
 const pct=Math.min(100,subtotal/target*100);
 return `<div class="panel"><strong>${remaining>0?`${money(remaining)} away from the $75 demo threshold`:'Demo threshold reached!'}</strong>
 <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

}

}

 const content=document.getElementById("drawer-content");
 const subtotal=cart.reduce((sum,item)=>sum+(findProduct(item.id)?.price||0)*item.quantity,0);
 content.innerHTML=cart.length?`${cart.map((item,index)=>{
 const p=findProduct(item.id);if(!p)return '';
 const img=safeURL(p.image);
 return `<div class="drawer-item"><div style="display:flex;gap:10px;align-items:start">
 ${img?`<img src="${escapeHTML(img)}" alt="">`:''}
 <div><strong>${escapeHTML(p.name)}</strong><p class="small-note">${item.variant?`Option: ${escapeHTML(item.variant)} · `:""}${money(p.price)} each</p>
 <button class="small-btn" onclick='drawerChange(${index},-1)'>−</button> ${item.quantity}
 <button class="small-btn" onclick='drawerChange(${index},1)'>+</button></div></div>
 <button class="small-btn" onclick='drawerRemove(${index})'>✕</button></div>`;
 }).join('')}${shippingProgress(subtotal)}
 <h3>Subtotal: ${money(subtotal)}</h3>${promoHTML(subtotal)}

 <button class="btn" onclick="closePanels();showCart()">View Full Cart</button>`:
 `<p class="description">Your cart is empty.</p><button class="btn" onclick="closePanels();openShop()">Browse Products</button>`;

function drawerChange(index,delta){
 const item=cart[index];if(!item)return;
 const next=item.quantity+delta;
 if(next>99){notify("Maximum 99 per option.");return;}
 if(next<=0)cart.splice(index,1);else item.quantity=next;
 saveCart();renderCartDrawer();
}

function addToCart(id){
 const product=findProduct(id);
 if(!product)return;

 const context=document.getElementById("quick-modal").classList.contains("open")?document.getElementById("quick-modal"):app;
 const quantity=Number(context.querySelector("#quantity")?.value ?? 1);
 const variant=variantOptions(product)?(context.querySelector("#product-variant")?.value||""):"";

 if(!Number.isInteger(quantity)||quantity<1||quantity>99){
  notify("Choose a quantity from 1 to 99.");
  return;
 }

 const existing=cart.find(item=>
  String(item.id)===String(id)&&String(item.variant||"")===variant
 );

 if(existing){
  if(existing.quantity+quantity>99){
   notify("Maximum 99 per product.");
   return;
  }
  existing.quantity+=quantity;
 }else{
  cart.push({id,quantity,variant});
 }

 saveCart();
 recordEvent("adds",id);
 notify(product.name+" added to cart!");
 closePanels();
 openCartDrawer();
}

function changeQuantity(index,change){
 const item=cart[index];if(!item)return;
 const next=item.quantity+change;
 if(next>99){notify("Maximum 99 per option.");return;}
 if(next<=0){removeItem(index);return;}
 item.quantity=next;saveCart();showCart();
}
function removeItem(index){if(!cart[index])return;cart.splice(index,1);saveCart();showCart();}

function clearCart(){
 cart=[];
 saveCart();
 showCart();
}

function getResearchNumbers(){
 return {
  cost:Number(document.getElementById("r-cost").value),
  shipping:Number(document.getElementById("r-shipping").value),
  price:Number(document.getElementById("r-price").value),
  fees:Number(document.getElementById("r-fees").value)
 };
}

function calculateResearch(){
 const item=getResearchNumbers();
 const profit=researchProfit(item);
 const margin=researchMargin(item);

 const profitEl=document.getElementById("r-profit");
 const marginEl=document.getElementById("r-margin");

 profitEl.textContent=money(profit);
 marginEl.textContent=margin.toFixed(1)+"%";

 profitEl.classList.toggle("negative",profit<0);
 marginEl.classList.toggle("negative",margin<0);
}

function addResearchItem(event){
 event.preventDefault();

 const numbers=getResearchNumbers();
 const name=document.getElementById("r-name").value.trim();
 const link=document.getElementById("r-link").value.trim();
 const notes=document.getElementById("r-notes").value.trim();

 if(!name||!Object.values(numbers).every(validNumber)||
    numbers.price<=0){
  notify("Enter valid product information.");
  return;
 }

 if(link&&!safeURL(link)){
  notify("Enter a valid supplier URL.");
  return;
 }

 const item={
  id:"r-"+Date.now()+"-"+Math.random().toString(36).slice(2),
  name,link,notes,...numbers
 };

 researchItems.unshift(item);

 if(!save("trenviko-research",researchItems)){
  researchItems.shift();
  return;
 }

 renderShortlist();
 document.getElementById("r-name").value="";
 document.getElementById("r-link").value="";
 document.getElementById("r-notes").value="";
 notify("Product saved to shortlist!");
}

  el.innerHTML=`

  return;

  const profit=researchProfit(item);
  const margin=researchMargin(item);
  const link=safeURL(item.link);

  return `
   <div class="saved-item">

     </strong>
    </p>

    ${link?`
     <p><a href="${escapeHTML(link)}"
      target="_blank" rel="noopener noreferrer">

    `:""}

    ${item.notes?`

     </button>

     <button class="btn danger"

      Delete
     </button>

   </div>

function loadResearchItem(index){

 if(!item)return;

 if(data.originalPrice!==null&&
    (!validNumber(data.originalPrice)||
     data.originalPrice<=data.price)){

  notify("Enter a valid main image URL.");
  return;

    data.images.length>8){

function exportStoreBackup(){
 const data={format:"TRENVIKO-local-backup",version:1,created:new Date().toISOString(),values:{}};
 for(const key of backupKeys){try{const value=localStorage.getItem(key);if(value!==null)data.values[key]=JSON.parse(value);}catch{}}
 // Current product edits may exist only in memory if storage was blocked.
 data.values["trenviko-products"]=products;
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="TRENVIKO_Day20_Data_Backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 notify("Backup exported");
}
async function importStoreBackup(file){
 if(!file)return;
 if(file.size>2000000){notify("Backup file is too large.");return;}
 try{
  const data=JSON.parse(await file.text());
  if(data.format!=="TRENVIKO-local-backup"||data.version!==1||!data.values||typeof data.values!=="object"||Array.isArray(data.values))throw Error("Wrong format");
  if(!Array.isArray(data.values["trenviko-products"])||!data.values["trenviko-products"].every(validProduct))throw Error("Invalid products");
  if(!confirm("Replace your current TRENVIKO browser data with this backup?"))return;
  const previous={};for(const key of backupKeys)previous[key]=localStorage.getItem(key);
  try{
   for(const key of backupKeys){if(Object.prototype.hasOwnProperty.call(data.values,key))localStorage.setItem(key,JSON.stringify(data.values[key]));else localStorage.removeItem(key);}
  }catch(e){for(const key of backupKeys){try{if(previous[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,previous[key]);}catch{}}throw e;}
  alert("Backup imported. The page will reload now.");location.reload();
 }catch(e){notify("Import failed: invalid backup or storage unavailable.");}
}

const d23Key='trenviko-day23-ideas';
let d23Ideas=load(d23Key,[]);
if(!Array.isArray(d23Ideas))d23Ideas=[];
function d23Evaluate(idea){
 const price=Number(idea.price),cost=Number(idea.cost),shipping=Number(idea.shipping),fees=Number(idea.fees);
 const profit=Math.round((price-cost-shipping-fees)*100)/100;
 const margin=price>0?profit/price*100:0;
 const concerns=[];
 if(profit<=0)concerns.push('Estimated loss per order');
 else if(margin<20)concerns.push('Thin estimated margin');
 if(idea.risk==='high')concerns.push('Higher returns or product-safety uncertainty');
 if(idea.shippingSpeed==='unknown')concerns.push('Delivery time needs verification');
 if(!idea.supplier)concerns.push('Supplier not yet identified');
 const points=(profit>0?25:0)+(margin>=35?25:margin>=20?12:0)+(idea.risk==='low'?20:idea.risk==='medium'?10:0)+(idea.shippingSpeed==='known'?15:0)+(idea.supplier?15:0);
 return {profit,margin,concerns,points};
}

function d25AddSupplier(e){e.preventDefault();const f=new FormData(e.target);const obj={id:d25UID()};for(const k of ['product','name','url','status','notes'])obj[k]=String(f.get(k)||'').trim();for(const k of ['cost','shipping'])obj[k]=Number(f.get(k));obj.days=String(f.get('days')||'').trim();if(!obj.product||!obj.name||!['cost','shipping'].every(k=>validNumber(obj[k]))){notify('Check supplier fields');return;}if(obj.url&&!safeURL(obj.url)){notify('Enter a valid http(s) website');return;}d25Suppliers.unshift(obj);d25Suppliers=d25Suppliers.slice(0,100);save(d25SupplierKey,d25Suppliers);e.target.reset();d25RenderSuppliers();notify('Supplier candidate saved');}

 ${d28Field("d28-name","Supplier name")}
 ${d28Field("d28-product","Product")}
 ${d28Field("d28-url","Supplier website (optional)","url")}
 ${d28Field("d28-unit","Unit cost (CAD)","number","", 'min="0" step="0.01"')}
 ${d28Field("d28-ship","Shipping per unit (CAD)","number","", 'min="0" step="0.01"')}
 ${d28Field("d28-days","Estimated delivery days","number","", 'min="0" step="1"')}
 <label>Verification status<select class="field" id="d28-status"><option value="Unverified">Unverified</option><option value="Contacted">Contacted</option><option value="Sample ordered">Sample ordered</option><option value="Sample inspected">Sample inspected</option></select></label>
 <button class="btn" onclick="d28AddSupplier()">Save supplier</button>
 <p class="small-note">A status you select is not independent verification.</p></div>
 <div class="panel"><h2>Supplier comparison</h2><p>Lower prices alone do not mean better suppliers. Check product quality, returns, delivery and reliability.</p>${records.length?records.map((x,i)=>`<div class="d28-record"><h3>${escapeHTML(x.name)}</h3><p>${escapeHTML(x.product)} · ${escapeHTML(x.status)}</p><p>Unit: ${money(x.unit)} · Shipping: ${money(x.shipping)} · Landed before duties/fees: <strong>${money(x.unit+x.shipping)}</strong></p><p>Delivery estimate: ${x.days} day(s)</p>${safeURL(x.url)?`<a href="${escapeHTML(safeURL(x.url))}" target="_blank" rel="noopener noreferrer" style="color:var(--green)">Supplier website</a>`:""}<div class="d28-actions"><button class="small-btn" onclick="d28RemoveSupplier(${i})">Remove</button></div></div>`).join(""):"<p>No supplier candidates saved yet.</p>"}</div></div>`;
}
function d28AddSupplier(){
 const get=id=>document.getElementById(id)?.value.trim()||"";
 const name=get("d28-name"),product=get("d28-product"),url=get("d28-url");
 const unit=Number(get("d28-unit")),shipping=Number(get("d28-ship")),days=Number(get("d28-days"));
 if(!name||!product||![unit,shipping,days].every(n=>Number.isFinite(n)&&n>=0&&n<=100000)||!get("d28-unit")||!get("d28-ship")||!get("d28-days")){notify("Enter supplier, product and valid costs/days.");return;}
 if(url&&!safeURL(url)){notify("Enter a valid http/https website or leave blank.");return;}
 const records=d28Suppliers();records.push({name:name.slice(0,120),product:product.slice(0,120),url,unit,shipping,days,status:get("d28-status")});
 save(D28_SUPPLIERS,records);showDay28HQ("suppliers");notify("Supplier candidate saved locally");
}
function d28RemoveSupplier(i){if(!confirm("Remove this supplier candidate?"))return;const records=d28Suppliers();records.splice(i,1);save(D28_SUPPLIERS,records);showDay28HQ("suppliers");}
function d28ProfitView(){
 return `<div class="d28-grid"><div class="panel"><h2>True-cost calculator</h2>
 ${d28Field("d28-price","Selling price (CAD)","number","29.99",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-cost","Product cost (CAD)","number","8",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-shipping","Supplier shipping (CAD)","number","4",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-duty","Duties / other unit costs (CAD)","number","0",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-feepercent","Payment/platform fee (%)","number","3",'min="0" max="100" step="0.1" oninput="d28Calculate()"')}
 ${d28Field("d28-feeflat","Flat fee per order (CAD)","number","0.30",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-ads","Advertising cost per sale (CAD)","number","5",'min="0" step="0.01" oninput="d28Calculate()"')}
 ${d28Field("d28-returns","Expected return/refund allowance per sale (CAD)","number","1",'min="0" step="0.01" oninput="d28Calculate()"')}
 <button class="btn" onclick="d28Calculate()">Calculate</button></div><div class="panel"><h2>Estimated unit economics</h2><div id="d28-profit-output"><p>Enter costs and select Calculate.</p></div><p class="small-note">Estimates exclude income taxes and any unentered costs. Taxes charged to customers and remitted to authorities are not profit.</p></div></div>`;
}
function d28Calculate(){
 const ids=["price","cost","shipping","duty","feepercent","feeflat","ads","returns"];
 const v=ids.map(k=>Number(document.getElementById("d28-"+k)?.value));
 const out=document.getElementById("d28-profit-output");
 if(!v.every(Number.isFinite)||v.some(x=>x<0)||v[4]>100){out.textContent="Enter valid nonnegative numbers and a fee percentage of 0–100.";return;}
 const [price,cost,shipping,duty,feePct,feeFlat,ads,returns]=v;
 const fees=price*feePct/100+feeFlat;
 const total=cost+shipping+duty+fees+ads+returns;
 const profit=price-total;
 const margin=price>0?profit/price*100:0;
 out.innerHTML=`<div class="d28-stat"><span>Estimated profit per sale</span><strong style="${profit<0?"color:#ff9b9b":""}">${money(profit)}</strong></div><p>Total estimated cost: <strong>${money(total)}</strong></p><p>Estimated margin: <strong>${margin.toFixed(1)}%</strong></p><p>${profit<=0?"This estimate is not profitable. Review your costs or pricing.":"Positive estimate — still verify costs, returns, taxes and demand."}</p>`;
}
function d28LaunchView(checks){
 return `<div class="panel"><h2>Launch readiness checklist</h2><p>Tick only tasks you have actually completed. Progress is saved in this browser.</p>${d28Steps.map(([name,detail],i)=>`<label class="d28-check"><input type="checkbox" ${checks[i]?"checked":""} onchange="d28SetCheck(${i},this.checked)"><span><strong>${escapeHTML(name)}</strong><small>${escapeHTML(detail)}</small></span></label>`).join("")}</div>`;
}
function d28SetCheck(i,checked){const c=d28Checks();c[i]=checked;save(D28_CHECKS,c);const done=d28Steps.filter((_,j)=>c[j]).length;document.querySelectorAll(".d28-statgrid .d28-stat strong")[1].textContent=done+"/"+d28Steps.length;}
function d28Export(){
 const payload={version:28,exportedAt:new Date().toISOString(),suppliers:d28Suppliers(),checklist:d28Checks()};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="trenviko-day28-research.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}


// DAY 29: Local-only planning, not live pricing, AI, supplier verification, or checkout.
const D29_KEY='trenviko-day29-scenarios';let d29Tab='calculator';
function d29Saved(){const a=load(D29_KEY,[]);return Array.isArray(a)?a.filter(x=>x&&typeof x.name==='string').slice(0,100):[];}
function d29Input(k,label,value){return `<label>${escapeHTML(label)}<input class="field" id="d29-${k}" type="number" min="0" max="100000" step="0.01" value="${value}" oninput="d29Calculate()"></label>`;}
function showDay29Mega(tab='calculator'){
 d29Tab=tab;currentPage='day29';
 app.innerHTML=`<section class="section"><div class="d29-head"><div class="eyebrow">DAY 29 · BUSINESS MEGA UPGRADE</div><h1>Profit Guard<br>Command Center.</h1><p>Know your numbers before you sell. Model supplier costs, discover break-even prices, compare advertising risks, save product scenarios and build a responsible launch brief.</p></div>
 <div class="d29-tabs">${[['calculator','Profit calculator'],['saved','Saved products'],['brief','Launch brief']].map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="showDay29Mega('${id}')">${name}</button>`).join('')}</div>
 <div id="d29-workspace">${tab==='calculator'?d29Calculator():tab==='saved'?d29SavedView():d29BriefView()}</div></section>`;
 navigate();if(tab==='calculator')d29Calculate();
}
function d29Calculator(){return `<div class="d29-layout"><div class="panel"><h2>Price your product</h2>
 <label>Choose a store product<select class="field" id="d29-product" onchange="d29Pick()"><option value="">Custom product</option>${products.map(p=>`<option value="${escapeHTML(String(p.id))}">${escapeHTML(p.name)}</option>`).join('')}</select></label>
 <label>Product name<input class="field" id="d29-name" maxlength="120" value="Bluetooth Winter Earmuffs"></label>
 ${d29Input('price','Selling price (CAD)',29.99)}${d29Input('unit','Supplier unit cost (CAD)',12)}${d29Input('ship','Shipping cost per order (CAD)',4)}${d29Input('fee','Processing fee (%)',3)}${d29Input('flat','Flat processing fee (CAD)',0.3)}${d29Input('ads','Advertising cost per sale (CAD)',5)}${d29Input('returns','Expected returns/refunds allowance (CAD)',1)}${d29Input('other','Other costs per order (CAD)',0)}${d29Input('target','Target profit margin (%)',20)}
 <div class="d29-actions"><button class="btn" onclick="d29Calculate()">Recalculate</button><button class="btn secondary" onclick="d29Save()">Save scenario</button></div><p class="small-note">Example inputs are not supplier quotes. Replace them with actual figures.</p></div>
 <div class="panel"><h2>Profit and risk analysis</h2><div id="d29-output" aria-live="polite"></div></div></div>`;}
function d29Pick(){const id=document.getElementById('d29-product').value;const p=products.find(p=>String(p.id)===id);if(!p)return;document.getElementById('d29-name').value=p.name;document.getElementById('d29-price').value=p.price;d29Calculate();}
function d29Compute(){const keys=['price','unit','ship','fee','flat','ads','returns','other','target'];const vals=keys.map(k=>{const e=document.getElementById('d29-'+k);return e&&e.value.trim()!==''?Number(e.value):NaN;});if(vals.some(n=>!Number.isFinite(n)||n<0||n>100000)||vals[3]>=100||vals[8]>=100)return null;
 const [price,unit,ship,fee,flat,ads,returns,other,target]=vals;const base=unit+ship+flat+ads+returns+other;const rate=fee/100;const cost=base+price*rate;const profit=price-cost;const breakeven=base/(1-rate);const targetPrice=target/100+rate<1?base/(1-rate-target/100):null;const maxAds=price*(1-rate)-unit-ship-flat-returns-other;return {price,unit,ship,fee,flat,ads,returns,other,target,cost,profit,breakeven,targetPrice,maxAds,margin:price>0?100*profit/price:0};}
function d29Calculate(){const out=document.getElementById('d29-output');if(!out)return;const x=d29Compute();if(!x){out.innerHTML='<p class="d29-warning">Please enter valid nonnegative numbers. Percentage fees and target margin must be below 100%.</p>';return;}
 const negative=x.profit<0;const risk=negative?'Loss on every estimated sale':x.margin<15?'Thin margin — costs could erase profit':'Positive estimated contribution';
 out.innerHTML=`<div class="d29-metrics"><div class="d29-metric"><span>Profit per sale</span><strong style="color:${negative?'#ff9b9b':'var(--green)'}">${money(x.profit)}</strong></div><div class="d29-metric"><span>Break-even price</span><strong>${money(x.breakeven)}</strong></div><div class="d29-metric"><span>Profit margin</span><strong>${x.margin.toFixed(1)}%</strong></div></div><p class="${negative||x.margin<15?'d29-warning':'notice'}">${risk}</p>
 <table class="d29-table"><tr><td>Customer selling price</td><td>${money(x.price)}</td></tr><tr><td>Supplier + shipping</td><td>${money(x.unit+x.ship)}</td></tr><tr><td>Fees + ads + returns + other</td><td>${money(x.cost-x.unit-x.ship)}</td></tr><tr><td>Total estimated cost</td><td>${money(x.cost)}</td></tr><tr><td>Max ads per sale before loss</td><td>${money(x.maxAds)}</td></tr><tr><td>Price for ${x.target}% target margin</td><td>${x.targetPrice===null?'Not achievable':money(x.targetPrice)}</td></tr></table>
 <h3>What if advertising costs change?</h3><table class="d29-table"><tr><th>Ads per sale</th><th>Estimated profit</th></tr>${[0,2,5,10,15].map(a=>`<tr><td>${money(a)}</td><td style="color:${x.profit+x.ads-a<0?'#ff9b9b':'var(--green)'}">${money(x.profit+x.ads-a)}</td></tr>`).join('')}</table>
 <p class="small-note">Not included unless entered: taxes, duties, subscriptions, chargebacks, customer support and unexpected losses. A positive estimate does not guarantee demand or real profit.</p>`;
}
function d29Save(){const x=d29Compute(),name=document.getElementById('d29-name')?.value.trim();if(!x||!name){notify('Enter a product name and valid numbers.');return;}const a=d29Saved();a.unshift({...x,name:name.slice(0,120),savedAt:new Date().toISOString()});save(D29_KEY,a.slice(0,100));notify('Pricing scenario saved locally');}
function d29SavedView(){const a=d29Saved();return `<div class="panel"><h2>Saved pricing scenarios</h2><p>Compare your estimates. These are not real sales or verified supplier prices.</p>${a.length?a.map((x,i)=>`<div class="d29-record"><h3>${escapeHTML(x.name)}</h3><p>Selling price: ${money(x.price)} · Supplier: ${money(x.unit)} · Ads: ${money(x.ads)}</p><p>Estimated profit: <strong style="color:${x.profit<0?'#ff9b9b':'var(--green)'}">${money(x.profit)}</strong> · Margin: ${Number(x.margin).toFixed(1)}%</p><button class="small-btn" onclick="d29Remove(${i})">Delete</button></div>`).join(''):'<p>No saved scenarios yet. Start in Profit calculator.</p>'}<div class="d29-actions"><button class="btn secondary" onclick="d29Export()">Export scenarios as JSON</button></div></div>`;}
function d29Remove(i){if(!confirm('Delete this saved scenario?'))return;const a=d29Saved();a.splice(i,1);save(D29_KEY,a);showDay29Mega('saved');}
function d29Export(){const blob=new Blob([JSON.stringify({version:29,exportedAt:new Date().toISOString(),scenarios:d29Saved()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='trenviko-day29-pricing.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function d29BriefView(){return `<div class="d29-layout"><div class="panel"><h2>Build a product launch brief</h2><label>Product name<input class="field" id="d29-brief-name" maxlength="120" placeholder="e.g. Grip Socks"></label><label>Customer problem<textarea class="field" id="d29-brief-problem" rows="3" placeholder="What problem does this product solve?"></textarea></label><label>Verified product features<textarea class="field" id="d29-brief-features" rows="3" placeholder="Only features you can confirm"></textarea></label><label>Why choose this product?<textarea class="field" id="d29-brief-reason" rows="3" placeholder="Your honest product advantage"></textarea></label><div class="d29-actions"><button class="btn" onclick="d29GenerateBrief()">Generate brief</button><button class="btn secondary" onclick="d29CopyBrief()">Copy brief</button></div></div><div class="panel"><h2>Your launch outline</h2><div class="d29-brief" id="d29-brief-output">Fill in the form and generate your brief.</div></div></div>`;}
function d29GenerateBrief(){const get=id=>document.getElementById(id)?.value.trim()||'';const name=get('d29-brief-name');if(!name){notify('Enter a product name.');return;}const problem=get('d29-brief-problem'),features=get('d29-brief-features'),reason=get('d29-brief-reason');document.getElementById('d29-brief-output').textContent=`TRENVIKO — PRODUCT LAUNCH BRIEF\n\nPRODUCT: ${name}\n\nCUSTOMER PROBLEM\n${problem||'Research the customer problem.'}\n\nVERIFIED FEATURES\n${features||'Confirm product specifications with a sample.'}\n\nHONEST VALUE PROPOSITION\n${reason||'Describe the real benefit without exaggeration.'}\n\nBEFORE LAUNCH\n1. Compare suppliers and independently verify business details.\n2. Order and inspect a sample.\n3. Confirm delivery times, returns and product safety.\n4. Calculate realistic landed costs and break-even pricing.\n5. Have a parent/guardian handle accounts and contracts requiring an adult.\n6. Test the full checkout and fulfilment flow before accepting orders.\n\nMARKETING IDEA\nShow the product in a real-life use case. Use your own footage and only verified claims.\n\nNOTE: This brief is a template, not live AI-generated research.`;}
async function d29CopyBrief(){const t=document.getElementById('d29-brief-output')?.textContent||'';try{await navigator.clipboard.writeText(t);notify('Brief copied');}catch{notify('Select and copy the brief manually');}}

// TRENVIKO AI assistant — Gemini via Cloudflare Worker.
const tvChatHTML=`<button type="button" class="tv-chat-launch" id="tv-chat-launch" onclick="tvToggleChat()" aria-label="Open shopping assistant" aria-expanded="false">✦ Ask TRENVIKO</button>
<section class="tv-chat-panel" id="tv-chat-panel" aria-label="TRENVIKO shopping assistant" aria-hidden="true">
 <div class="tv-chat-head"><div><strong>✦ TRENVIKO Shopping Assistant</strong><small>AI shopping assistant · Demo store</small></div><button class="tv-chat-close" type="button" onclick="tvToggleChat(false)" aria-label="Close assistant">×</button></div>
 <div class="tv-chat-messages" id="tv-chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
 <div class="tv-chat-chips" id="tv-chat-chips"><button type="button" onclick="tvAsk('Show me sports products')">🏈 Sports</button><button type="button" onclick="tvAsk('Show me tech products')">⚡ Tech</button><button type="button" onclick="tvAsk('What can I get under $30?')">Under $30</button><button type="button" onclick="tvAsk('How does checkout work?')">Checkout help</button></div>
 <form class="tv-chat-form" id="tv-chat-form"><input id="tv-chat-input" type="text" maxlength="240" autocomplete="off" placeholder="Try: sports gear under $30" aria-label="Your shopping question" required><button type="submit">Send</button></form>
 <div class="tv-chat-disclaimer">AI-powered chat. Demo listings only; no real orders or payments. Do not share personal or payment information.</div>
</section>`;
document.body.insertAdjacentHTML('beforeend',tvChatHTML);
let tvChatStarted=false;
function tvToggleChat(force){
 const panel=document.getElementById('tv-chat-panel');
 const opening=typeof force==='boolean'?force:!panel.classList.contains('open');
 panel.classList.toggle('open',opening);panel.setAttribute('aria-hidden',String(!opening));
 document.getElementById('tv-chat-launch').setAttribute('aria-expanded',String(opening));
 if(opening){
  if(!tvChatStarted){tvChatStarted=true;tvBot('Hey! I’m the TRENVIKO AI shopping assistant. What can I help you find?');}
  document.getElementById('tv-chat-input').focus();
 }else document.getElementById('tv-chat-launch').focus();
}
function tvMessage(text,who='bot'){
 const box=document.getElementById('tv-chat-messages');
 const bubble=document.createElement('div');bubble.className='tv-chat-msg '+who;
 bubble.textContent=text;box.appendChild(bubble);box.scrollTop=box.scrollHeight;
 return bubble;
}
function tvBot(text,found=[]){
 const bubble=tvMessage(text,'bot');
 if(found.length){
  const list=document.createElement('div');list.className='tv-chat-products';
  found.forEach(p=>{
   const button=document.createElement('button');button.type='button';button.className='tv-chat-product';
   const url=safeURL(p.image||'');
   if(url){const img=document.createElement('img');img.src=url;img.alt='';img.loading='lazy';button.appendChild(img);}
   const label=document.createElement('span');const name=document.createElement('strong');name.textContent=p.name;
   const price=document.createElement('small');price.textContent=money(p.price)+' · View product →';
   label.append(name,price);button.appendChild(label);
   button.addEventListener('click',()=>{tvToggleChat(false);showProduct(p.id);});list.appendChild(button);
  });
  bubble.appendChild(list);
 }
 document.getElementById('tv-chat-messages').scrollTop=999999;
}
const TV_AI_URL='https://trenviko-ai.satousignant.workers.dev/';
const tvHistory=[];
let tvSending=false;
async function tvAsk(question){
 const text=String(question||'').trim().slice(0,240);
 if(!text||tvSending)return;
 tvMessage(text,'user');
 tvHistory.push({role:'user',text});
 tvSending=true;
 const input=document.getElementById('tv-chat-input');
 const send=document.querySelector('#tv-chat-form button[type="submit"]');
 input.disabled=true;send.disabled=true;
 const pending=tvMessage('Thinking…','bot');
 try{
  const response=await fetch(TV_AI_URL,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:tvHistory.slice(-12)})
  });
  const data=await response.json();
  if(!response.ok||!data.reply)throw new Error(data.error||'AI did not respond');
  pending.textContent=data.reply;
  tvHistory.push({role:'model',text:data.reply});
 }catch(error){
  pending.textContent='AI connection is not working yet. '+(error.message||'Please try again later.')+' (No order was placed.)';
  tvHistory.pop();
 }finally{
  tvSending=false;input.disabled=false;send.disabled=false;input.focus();
  document.getElementById('tv-chat-messages').scrollTop=999999;
 }
}
document.getElementById('tv-chat-form').addEventListener('submit',e=>{
 e.preventDefault();const input=document.getElementById('tv-chat-input');const text=input.value;input.value='';tvAsk(text);input.focus();
});
</script>
